  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="brand-plate">P4<b>KVM</b></span>
        <span class="pill" id="status" data-tone="off">BOOT</span>
      </div>
      <div class="bar-right">
        <span class="tele" id="tele" title="draw fps / link rate">
          <b id="tele-fps">--</b><i>fps</i><em>·</em><b id="tele-mbps">--</b><i>Mb/s</i>
        </span>
        <div class="seg" role="group" aria-label="Pointer mode">
          <button type="button" id="mode-abs" class="seg-b" title="Absolute pointer (virtual tablet): cursor follows 1:1, no capture needed">TABLET</button>
          <button type="button" id="mode-rel" class="seg-b" title="Relative pointer (pointer lock): for BIOS/UEFI and games">REL</button>
        </div>
        <button type="button" class="ico" id="btn-fullscreen" title="Fullscreen" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button type="button" class="ico" id="btn-drawer" title="Panel" aria-label="Panel" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
        </button>
      </div>
    </header>

    <main class="stage-wrap" id="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="kvm" width="1920" height="1080" tabindex="0"></canvas>
        <span class="bracket tl" aria-hidden="true"></span>
        <span class="bracket tr" aria-hidden="true"></span>
        <span class="bracket bl" aria-hidden="true"></span>
        <span class="bracket br" aria-hidden="true"></span>
        <div class="nosignal" id="nosignal">
          <div class="ns-static" aria-hidden="true"></div>
          <div class="ns-body">
            <div class="ns-title">NO SIGNAL</div>
            <div class="ns-reason" id="ns-reason">waiting for stream…</div>
            <div class="ns-hint" id="ns-hint"></div>
          </div>
        </div>
        <div class="stagehint" id="stagehint"></div>
      </div>
    </main>

    <div class="scrim" id="scrim" hidden></div>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="dr-head">
        <span class="dr-title">CONSOLE PANEL</span>
        <button type="button" class="ico" id="btn-drawer-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <section class="dr-sec">
        <h2>KEYBOARD</h2>
        <div class="row">
          <button type="button" class="act" id="btn-send-esc" disabled>ESC</button>
          <button type="button" class="act" id="btn-cad" disabled title="Send Ctrl+Alt+Del">CTRL·ALT·DEL</button>
          <button type="button" class="act" id="btn-paste-clip" disabled>PASTE CLIPBOARD</button>
        </div>
      </section>

      <section class="dr-sec" id="sec-power" hidden>
        <h2>HOST POWER</h2>
        <div class="row">
          <button type="button" class="act" id="btn-atx-power" hidden title="Tap power (boot / soft shutdown)">POWER</button>
          <button type="button" class="act" id="btn-atx-reset" hidden title="Tap reset">RESET</button>
          <button type="button" class="act danger" id="btn-atx-force" hidden title="Hold power 5 s (force off)">FORCE OFF</button>
        </div>
      </section>

      <section class="dr-sec">
        <h2>VIDEO</h2>
        <label class="fld">
          <span class="fld-l">JPEG quality <b id="q-val">--</b></span>
          <input type="range" id="jpeg-q" min="1" max="100" step="1" value="70" />
        </label>
      </section>

      <section class="dr-sec">
        <h2>POINTER</h2>
        <label class="fld">
          <span class="fld-l">Sensitivity (relative mode) <b id="sens-val">100%</b></span>
          <input type="range" id="ptr-sens" min="25" max="300" step="5" value="100" />
        </label>
      </section>

      <section class="dr-sec">
        <h2>DIAGNOSTICS</h2>
        <dl class="diag" id="diag"></dl>
      </section>

      <footer class="dr-foot" id="dr-foot">p4kvm</footer>
    </aside>

  </body>
</html>
